[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fzero-dev-mcp"
version = "0.1.0"
description = "MCP sidecar for the local ares debug bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = ["mcp[cli]>=2.0,<3", "pytest>=8"]

[project.scripts]
fzero-dev-mcp = "ares_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
